name: agent-office

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -q"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *default-logging
    networks:
      - data

  migrate:
    build:
      context: ./apps/api
    command: ["python", "-m", "app.infrastructure.postgres.migrate"]
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?set MIGRATION_DATABASE_URL in .env}
      APP_DB_USER: ${APP_DB_USER:?set APP_DB_USER in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true
    restart: "no"
    logging: *default-logging
    networks:
      - data


  api:
    build:
      context: ./apps/api
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OWNER_USERNAME: ${OWNER_USERNAME:?set OWNER_USERNAME in .env}
      OWNER_PASSWORD_HASH: ${OWNER_PASSWORD_HASH:?set OWNER_PASSWORD_HASH in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-strict}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RUNNER_SHARED_TOKEN: ${RUNNER_SHARED_TOKEN:-}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app
      - data

  runtime-launcher:
    image: agent-office-runtime-launcher:local
    build:
      context: ./apps/launcher
    environment:
      RUNTIME_LAUNCHER_TOKEN: ${RUNTIME_LAUNCHER_TOKEN:?set RUNTIME_LAUNCHER_TOKEN in .env}
      RUN_WORKER_IMAGE: agent-office-runner:local
      RUNTIME_PROXY_IMAGE: agent-office-runtime-launcher:local
      RUNTIME_EGRESS_NETWORK: agent-office-runtime-egress
      RUN_WORKER_UID: ${RUNNER_UID:-1000}
      RUN_WORKER_GID: ${RUNNER_GID:-1000}
      WORKSPACE_ROOT: /workspace-root
      NINEROUTER_KEY: ${NINEROUTER_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose:
      - "8001"
    volumes:
      - ./workspaces:/workspace-root:rw
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    init: true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app
      - runtime-egress

  runner:
    image: agent-office-runner:local
    build:
      context: ./apps/runner
    user: "${RUNNER_UID:-1000}:${RUNNER_GID:-1000}"
    environment:
      RUNNER_API_URL: http://api:8000
      RUNNER_SHARED_TOKEN: ${RUNNER_SHARED_TOKEN:?set RUNNER_SHARED_TOKEN in .env}
      RUNNER_STATE_ROOT: /state
      RUNTIME_LAUNCHER_URL: http://runtime-launcher:8001
      RUNTIME_LAUNCHER_TOKEN: ${RUNTIME_LAUNCHER_TOKEN:?set RUNTIME_LAUNCHER_TOKEN in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./.runner-state:/state:rw
    depends_on:
      api:
        condition: service_healthy
      runtime-launcher:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app

  api-postgres-test:
    profiles: ["test"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile.test
    environment:
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    logging: *default-logging
    networks:
      - data

  web:
    build:
      context: ./apps/web
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8000
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app

  proxy:
    image: nginx:1.29-alpine
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # The only host-published port. Loopback-only until a TLS terminator is
      # placed in front of it; see deploy/README.md.
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app

volumes:
  redis_data:
  db_data:

networks:
  app: {}
  data:
    internal: true
  runtime-egress:
    name: agent-office-runtime-egress
